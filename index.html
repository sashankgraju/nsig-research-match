  --sub-spine:#5cbfa9; --sub-onc:#e2687b; --sub-vasc:#f08a4b; --sub-peds:#7fa8ec; --sub-func:#b08cf0; --sub-skull:#d4b25a; --sub-pn:#8dc263; --sub-trauma:#a3abb8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }
html,body{background:var(--canvas)}
.nsig{font-family:var(--f-body);color:var(--ink);background:var(--canvas);min-height:100%;font-size:14px;line-height:1.5}
.nsig *{box-sizing:border-box}
.nsig h1,.nsig h2,.nsig h3{text-wrap:balance}
.f-display{font-family:var(--f-display);letter-spacing:-.01em}
.f-mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.c-ink{color:var(--ink)} .c-muted{color:var(--muted)} .c-faint{color:var(--faint)} .c-accent{color:var(--accent)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-info{color:var(--info)}
.bg-canvas{background:var(--canvas)} .bg-panel{background:var(--panel)} .bg-sunken{background:var(--sunken)} .bg-accent-soft{background:var(--accent-soft)}
.bd{border-color:var(--line)} .bd-strong{border-color:var(--line-strong)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-hover{transition:border-color .15s, box-shadow .15s}
.card-hover:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:7px;font-weight:500;font-size:13px;padding:.45rem .8rem;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);transition:background .15s,border-color .15s;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--sunken)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--sunken);color:var(--ink)}
.btn-sm{font-size:12px;padding:.28rem .55rem;border-radius:6px}
.input{width:100%;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:7px;padding:.5rem .65rem;font-size:14px;font-family:inherit}
.input::placeholder{color:var(--faint)}
.input[aria-invalid="true"]{border-color:var(--accent)}
.nsig :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.12rem .55rem;font-size:12px;color:var(--muted);background:var(--panel);white-space:nowrap}
.chip-toggle{cursor:pointer}
.chip-toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.1rem .55rem;font-size:12px;font-weight:500;white-space:nowrap}
.pill-info{background:var(--info-soft);color:var(--info)} .pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-accent{background:var(--accent-soft);color:var(--accent)}
.pill-neutral{background:var(--neutral-soft);color:var(--neutral)}
.dot{width:8px;height:8px;border-radius:999px;flex:none}
.tab{position:relative;padding:.7rem .2rem;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem;background:none;border:0;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sunken);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:500;padding:.32rem .65rem;border-radius:6px;display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.backdrop{background:rgba(10,14,20,.45)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar-track{background:var(--sunken);border-radius:4px;height:10px;position:relative;overflow:hidden}
.bar{position:absolute;inset:0 auto 0 0;border-radius:4px}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.anim-slide{animation:slideIn .2s ease-out} .anim-rise{animation:rise .18s ease-out}
@media (prefers-reduced-motion: reduce){.anim-slide,.anim-rise{animation:none}.card-hover{transition:none}}
